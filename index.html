        :root {

            --primary-glow: rgba(211, 47, 47, 0.6);
            --gold: #d4af37;
            --hot-pink: #c2185b;
            --font-title: 'Amiri', serif;
            --font-body: 'Tajawal', sans-serif;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: #f5f5f5;
            background-image: radial-gradient(circle at 50% 0%, #3a0000 0%, var(--bg-dark) 80%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        h1, h2, h3, .title-font { font-family: var(--font-title); }

        .glass-panel {
            background: var(--bg-card);
            border: 1px solid rgba(211, 47, 47, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .pulse-glow { animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow { 
            0% { text-shadow: 0 0 5px var(--primary-glow); } 
            50% { text-shadow: 0 0 20px var(--primary); } 
            100% { text-shadow: 0 0 5px var(--primary-glow); } 
        }

        /* Custom Inputs & Buttons */
        .input-field {
            width: 100%; padding: 12px 15px; margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.7); border: 1px solid var(--primary);
            color: var(--gold); border-radius: 8px; text-align: center; outline: none;
            transition: all 0.3s;
        }
        .input-field:focus { box-shadow: 0 0 15px var(--primary-glow); }

        .btn-main {
            background: linear-gradient(45deg, #8e0000, #d32f2f);
            color: white; padding: 12px 20px; border-radius: 8px; border: 1px solid var(--primary);
            width: 100%; font-weight: bold; cursor: pointer; transition: all 0.3s;
        }
        .btn-main:hover, .btn-main:active { transform: scale(0.98); box-shadow: 0 0 20px var(--primary-glow); }
        
        .btn-hot { background: linear-gradient(45deg, #880e4f, #c2185b); border-color: #ec407a; }
        
        /* Toggle Switch */
        .toggle-checkbox:checked { right: 0; border-color: #4ade80; }
        .toggle-checkbox:checked + .toggle-label { background-color: #4ade80; }
        
        /* Loader */
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--primary); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

        function getCoupleId(email1, email2) {
            // Sort emails to ensure both partners generate the same ID
            const sorted = [email1.toLowerCase().trim(), email2.toLowerCase().trim()].sort();
            return btoa(sorted.join('|')).replace(/=/g, '');
        }

        async function initAuth() {
            try {
                if (initialToken) {
                    try {
                        await signInWithCustomToken(auth, initialToken);
                    } catch (tokenError) {
                        console.warn("حدث عدم تطابق في التوكن (بسبب استخدام مشروع Firebase خاص). جاري استخدام تسجيل الدخول المجهول...");
                        await signInAnonymously(auth);
                    }
                } else {
                    await signInAnonymously(auth);
                }
                
                if (state.myEmail && state.partnerEmail) {
                    await connectCouple(state.myEmail, state.partnerEmail, state.myName);
                } else {
                    state.view = 'login';
                    renderApp();
                }
            } catch (error) {
                console.error("Auth error:", error);
                alert("حدث خطأ في الاتصال. حاول مرة أخرى.");
            }
        }

        async function connectCouple(myEmail, partnerEmail, myName) {
            state.view = 'loading'; renderApp();
            
            state.myEmail = myEmail.toLowerCase().trim();
            state.partnerEmail = partnerEmail.toLowerCase().trim();
            state.myName = myName.trim();
            state.coupleId = getCoupleId(state.myEmail, state.partnerEmail);
            
            // Save locally
            localStorage.setItem('sico_myEmail', state.myEmail);
            localStorage.setItem('sico_partnerEmail', state.partnerEmail);
            localStorage.setItem('sico_myName', state.myName);

            state.docRef = doc(db, 'artifacts', sandboxAppId, 'public', 'data', 'couples', state.coupleId);
            
            // Register user in the couple doc
            try {
                const docSnap = await getDoc(state.docRef);

                if (docSnap.exists()) {
                    // تحديث بيانات المستخدم وتفعيل الموافقة الدائمة إجبارياً
                    await updateDoc(state.docRef, {
                        [`users.${state.myEmail}.name`]: state.myName,
                        [`users.${state.myEmail}.online`]: true,
                        [`users.${state.myEmail}.autoConsent`]: true
                    });
                } else {
                    // إنشاء الغرفة لأول مرة
                    await setDoc(state.docRef, {
                        users: {
                            [state.myEmail]: { name: state.myName, autoConsent: true, online: true }
                        },
                        gameState: { active: false, gameId: null, history: {} },
                        invite: { status: 'none' }
                    });
                }

                // Start Listening
                listenToCoupleDoc();
            } catch (err) {
                console.error("Firestore error:", err);
            }
        }

        function listenToCoupleDoc() {
            if (state.unsubscribe) state.unsubscribe();
            
            state.unsubscribe = onSnapshot(state.docRef, (snapshot) => {
                if (snapshot.exists()) {
                    state.serverData = snapshot.data();
                    handleServerUpdates();
                }
            }, (error) => {
                console.error("Snapshot error:", error);
            });
        }

        function handleServerUpdates() {
            const data = state.serverData;
            
            // Routing based on game state
            if (data.gameState?.active) {
                if (state.view !== 'game') { state.view = 'game'; renderApp(); }
                else { updateGameUI(); }
            } else {
                if (state.view !== 'dashboard') { state.view = 'dashboard'; renderApp(); }
            }

            // Handle Invites (Popup)
            if (data.invite?.status === 'pending' && data.invite.sender !== state.myEmail) {
                showInviteModal(data.invite.gameId, data.invite.senderName);
            } else {
                hideModal();
            }
            
            // Handle Invite Rejection notification
            if (data.invite?.status === 'rejected' && data.invite.sender === state.myEmail) {
                showToast("رفض الطرف الآخر دعوتك الحالية.", "error");
                // Reset invite state after seeing it
                updateDoc(state.docRef, { 'invite.status': 'none' });
            }
        }

                historyArr = []; // Reset if all used
                showToast("تم إعادة خلط الأوامر من جديد!", "success");
            }

            let availableIndices = [];
            for (let i = 0; i < pool.length; i++) {
                if (!historyArr.includes(i)) availableIndices.push(i);
            }

            const randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
            let rawText = pool[randomIndex];

            });

            const seed = currentIndex + rawText.length; 

            // توزيع الأدوار بشكل موحد
            const senderName = (seed % 2 === 0) ? name1 : name2;
            const receiverName = (seed % 2 === 0) ? name2 : name1;

            return rawText
                .replace(/\[SENDER\]/g, `<span class="text-yellow-400 font-bold">${senderName}</span>`)
                .replace(/\[RECEIVER\]/g, `<span class="text-yellow-400 font-bold">${receiverName}</span>`);
        }

        // --- STREAMING_CHUNK: UI Rendering ---
        const domApp = document.getElementById('app');

        function renderApp() {
            if (state.view === 'loading') return;
            
            let html = '';
            if (state.view === 'login') html = getLoginHTML();
            else if (state.view === 'dashboard') html = getDashboardHTML();
            else if (state.view === 'game') html = getGameHTML();
            
            domApp.innerHTML = html;
            
            if (state.view === 'login') {
                document.getElementById('login-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const me = document.getElementById('inp-me').value;
                    const par = document.getElementById('inp-par').value;
                    const nm = document.getElementById('inp-name').value;
                    connectCouple(me, par, nm);
                });
            }
        }

        function updateGameUI() {
            if (state.view === 'game') {
                const gameContainer = document.getElementById('game-logic-area');
                if(gameContainer) gameContainer.innerHTML = getGameLogicHTML();
            }
        }

        function getLoginHTML() {
            return `
                <div class="glass-panel p-8 rounded-2xl fade-in mt-10">
                    <div class="text-center mb-8">
                        <h1 class="text-4xl text-yellow-500 mb-2 pulse-glow title-font">بوابة الجرأة</h1>
                        <p class="text-gray-300 text-sm">اربط هاتفك بهاتف شريكك لتبدأ المتعة عن بُعد</p>
                    </div>
                    <form id="login-form">
                        <input type="text" id="inp-name" required placeholder="اسمك (أو لقبك المفضل)" class="input-field">
                        <input type="email" id="inp-me" required placeholder="بريدك الإلكتروني" class="input-field">
                        <input type="email" id="inp-par" required placeholder="البريد الإلكتروني للشريك" class="input-field">
                        <button type="submit" class="btn-main mt-4 text-xl">دخول الغرفة السرية</button>
                    </form>
                    <p class="text-xs text-pink-400 text-center mt-6 font-bold">⚠️ تنويه: دخولكما للغرفة يعني موافقتكما التامة على كسر حواجز الحياء ومحتوى الألعاب الجريئة.</p>
                    <p class="text-xs text-gray-500 text-center mt-2">يستخدم البريد فقط لربط الجهازين بأمان ولا يتم تخزين بيانات شخصية.</p>
                </div>
            `;
        }

        function getDashboardHTML() {
            const data = state.serverData;
            let partnerName = 'في انتظار الشريك...';
            let partnerOnline = false;
            
            // Check partner status
            for (let email in data.users) {
                if (email !== state.myEmail) {
                    partnerName = data.users[email].name;
                    partnerOnline = true;
                }
            }

            let hotGames = ''; let basicGames = '';
            for (let key in GAMES_META) {
                const g = GAMES_META[key];
                const btnClass = g.type === 'hot' ? 'border-pink-800 border-t-4' : 'border-red-800 border-t-4';
                const titleColor = g.type === 'hot' ? 'text-pink-400' : 'text-yellow-500';
                
                const card = `
                    <div class="glass-panel p-5 rounded-xl cursor-pointer hover:-translate-y-1 transition-transform ${btnClass}" onclick="window.sendInvite('${key}')">
                        <h3 class="text-xl title-font mb-2 ${titleColor}">${g.title}</h3>
                        <p class="text-sm text-gray-400 leading-relaxed">${g.desc}</p>
                        <div class="mt-4 text-left">
                            <span class="text-xs bg-red-900 bg-opacity-50 text-red-200 px-3 py-1 rounded-full border border-red-800"><i class="fa-solid fa-paper-plane ml-1"></i> إرسال دعوة</span>
                        </div>
                    </div>`;
                if (g.type === 'hot') hotGames += card; else basicGames += card;
            }

            // Check if I sent an invite that is pending
            const pendingInviteAlert = (data.invite?.status === 'pending' && data.invite?.sender === state.myEmail) 
                ? `<div class="bg-yellow-900 bg-opacity-40 border border-yellow-600 text-yellow-200 p-3 rounded-lg mb-6 text-center text-sm animate-pulse">
                     <i class="fa-solid fa-hourglass-half ml-2"></i> تم إرسال الدعوة لـ ${partnerName}.. في انتظار القبول
                   </div>` : '';

            return `
                <div class="w-full fade-in pb-10 mt-6">
                    <div class="flex justify-between items-center mb-6 glass-panel p-4 rounded-xl">
                        <div>
                            <p class="text-sm text-gray-400">مرحباً، <span class="text-yellow-400 font-bold">${state.myName}</span></p>
                            <p class="text-xs mt-1">الشريك: <span class="${partnerOnline ? 'text-green-400' : 'text-gray-500'}">${partnerName} ${partnerOnline ? '🟢' : '⚪'}</span></p>
                        </div>
                        <button onclick="localStorage.clear(); location.reload();" class="text-gray-500 hover:text-white text-sm"><i class="fa-solid fa-sign-out-alt"></i> خروج</button>
                    </div>

                    ${pendingInviteAlert}

                    <h2 class="text-2xl text-pink-500 border-b-2 border-pink-800 pb-2 mb-4 title-font inline-block mt-4">🔥 قسم الجرأة والمحظورات</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">${hotGames}</div>

                    <h2 class="text-2xl text-yellow-500 border-b-2 border-red-800 pb-2 mb-4 title-font inline-block">الألعاب الحميمية</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${basicGames}</div>
                </div>
            `;
        }

        function getGameHTML() {
            const gameId = state.serverData.gameState.gameId;
            const gameMeta = GAMES_META[gameId];
            return `
                <div class="glass-panel p-6 rounded-2xl fade-in mt-6 border-2 ${gameMeta.type==='hot' ? 'border-pink-800' : 'border-yellow-600'}">
                    <h2 class="text-3xl text-center mb-6 title-font ${gameMeta.type==='hot' ? 'text-pink-400' : 'text-yellow-500'}">${gameMeta.title}</h2>
                    <div id="game-logic-area">${getGameLogicHTML()}</div>
                    <button onclick="window.endGame()" class="mt-8 bg-transparent border border-gray-600 text-gray-400 hover:text-white px-4 py-2 rounded-lg w-full text-sm transition-colors">إنهاء اللعبة والعودة</button>
                </div>
            `;
        }

        function getGameLogicHTML() {
            const data = state.serverData;
            const gameId = data.gameState.gameId;
            
            // 1. Render Game Content Directly (Consent is implicit upon login)
            const currentIndex = data.gameState.currentItem;
            let contentHTML = '<div class="text-center p-8"><div class="loader"></div><p class="mt-4 text-gray-400">جاري السحب...</p></div>';
            
            if (currentIndex !== null && currentIndex !== undefined) {
                const rawText = RAW_DATA[gameId][currentIndex];
                const formattedText = formatItemText(rawText);
                contentHTML = `
                    <div class="bg-red-900 bg-opacity-20 border border-red-800 p-6 rounded-xl text-center min-h-[150px] flex items-center justify-center relative overflow-hidden">
                        <div class="absolute -top-4 -right-4 text-6xl text-red-900 opacity-20"><i class="fa-solid fa-fire"></i></div>
                        <p class="text-xl md:text-2xl leading-loose font-bold title-font relative z-10 text-gray-100">${formattedText}</p>
                    </div>
                `;
            }

            return `
                <div class="fade-in">
                    ${contentHTML}
                    <button onclick="window.drawNextItem('${gameId}')" class="btn-main mt-6 text-xl shadow-lg shadow-red-900/50">
                        <i class="fa-solid fa-dice ml-2"></i> سحب أمر جديد
                    </button>
                    <p class="text-xs text-gray-500 text-center mt-4">النظام يضمن عدم تكرار الأوامر في هذه الجلسة</p>
                </div>
            `;
        }

        // --- STREAMING_CHUNK: Helpers & UI Notifications ---
        function showInviteModal(gameId, senderName) {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            const gameTitle = GAMES_META[gameId]?.title || 'لعبة جديدة';
            
            content.innerHTML = `
                <div class="text-5xl text-yellow-500 mb-4 animate-bounce"><i class="fa-solid fa-envelope-open-text"></i></div>
                <h3 class="text-2xl font-bold mb-2 title-font text-white">دعوة ساخنة!</h3>
                <p class="text-gray-300 mb-6">يريد <strong>${senderName}</strong> أن يلعب معك 
                    <br><span class="text-pink-400 font-bold text-xl">${gameTitle}</span>
                </p>
                <div class="flex gap-3">
                    <button onclick="window.acceptInvite()" class="flex-1 bg-green-600 hover:bg-green-500 text-white py-3 rounded-lg font-bold transition-colors">قبول الدخول</button>
                    <button onclick="window.rejectInvite()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white py-3 rounded-lg font-bold transition-colors">رفض</button>
                </div>
            `;
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function hideModal() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function showToast(msg, type='info') {
            const toast = document.createElement('div');
            toast.className = `fixed top-5 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-sm font-bold z-50 fade-in ${type==='error'?'bg-red-600 text-white':'bg-green-600 text-white'}`;
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity='0'; setTimeout(()=>toast.remove(),500); }, 3000);
        }

        // Export functions to window for inline HTML onclick handlers
        window.sendInvite = sendInvite;
        window.acceptInvite = acceptInvite;
        window.rejectInvite = rejectInvite;
        window.drawNextItem = drawNextItem;
        window.endGame = endGame;

        // Initialize
        window.onload = () => {
            initAuth();
        };
    </script>
</body>
</html>
